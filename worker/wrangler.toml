name = "tom-polls"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Only needed if the API token's account can see more than one Cloudflare
# account -- wrangler deploy will say so if it is ambiguous. Find it with
# `npx wrangler whoami` and uncomment:
# account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

# Created with: npx wrangler d1 create tom-polls
# Then paste the database_id it prints below, and run:
#   npx wrangler d1 execute tom-polls --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "tom-polls"
database_id = "eb8ad30e-417b-4e8f-9f19-ee13848a5c5a"
