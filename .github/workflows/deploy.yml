name: Deploy Theme to Hyvor Blogs

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Theme Files via Hyvor Console API
        env:
          HYVOR_KEY: ${{ secrets.HYVOR_CONSOLE_KEY }}
          SUBDOMAIN: "dev-d287e71c-2526-4197-ae4c-a7f2efbf7c83"
        run: |
          set -euo pipefail

          if [ -z "${HYVOR_KEY:-}" ]; then
            echo "::error::HYVOR_CONSOLE_KEY secret is not set"
            exit 1
          fi

          BASE="https://blogs.hyvor.com/api/console/v0/blog/$SUBDOMAIN"

          api() {
            # api <method> <path> [body-file] -> prints body, returns status via $API_STATUS
            local method="$1" path="$2" bodyfile="${3:-}"
            local out; out=$(mktemp)
            local args=(-sS -X "$method" "$BASE$path" -H "X-API-KEY: $HYVOR_KEY")
            if [ -n "$bodyfile" ]; then
              args+=(-H "Content-Type: application/json" --data-binary "@$bodyfile")
            fi
            API_STATUS=$(curl "${args[@]}" -o "$out" -w '%{http_code}') || API_STATUS="000"
            cat "$out"; rm -f "$out"
          }

          # 1. Existing files on the blog, keyed "folder/name" -> id
          echo "Fetching current theme files..."
          index=$(mktemp)
          api GET /theme/files > "$index"
          if [ "$API_STATUS" -lt 200 ] || [ "$API_STATUS" -ge 300 ]; then
            echo "::error::GET /theme/files failed ($API_STATUS): $(head -c 400 "$index")"
            exit 1
          fi
          map=$(mktemp)
          jq -r '.[] | "\(.folder)/\(.name)\t\(.id)"' "$index" > "$map"
          echo "Blog currently has $(wc -l < "$map") theme file(s)."

          created=0; updated=0; skipped=0; failed=0

          # 2. Only these folders exist in the Hyvor theme model. config.yaml has no
          #    valid folder and is intentionally not synced -- manage it in the Console.
          while IFS= read -r -d '' filepath; do
            folder="${filepath%%/*}"
            name="${filepath##*/}"

            # content is sent as a JSON string, so restrict to text files. Binary
            # assets (fonts, images) need the multipart `file` field on create.
            case "$name" in
              *.twig|*.scss|*.css|*.js|*.yaml|*.yml|*.json|*.svg|*.xml|*.txt|*.md)
                ;;
              *)
                echo "skip  (binary, not synced)  $filepath"
                skipped=$((skipped + 1))
                continue
                ;;
            esac

            id=$(awk -F'\t' -v k="$folder/$name" '$1 == k { print $2; exit }' "$map")
            body=$(mktemp)

            if [ -n "$id" ]; then
              jq -n --rawfile c "$filepath" '{content: $c}' > "$body"
              resp=$(api PATCH "/theme/file/$id" "$body")
              action="update"
            else
              jq -n --arg f "$folder" --arg n "$name" --rawfile c "$filepath" \
                '{folder: $f, name: $n, content: $c}' > "$body"
              resp=$(api POST /theme/file "$body")
              action="create"
            fi
            rm -f "$body"

            if [ "$API_STATUS" -ge 200 ] && [ "$API_STATUS" -lt 300 ]; then
              echo "ok    $action $API_STATUS  $filepath"
              [ "$action" = update ] && updated=$((updated + 1)) || created=$((created + 1))
            else
              echo "::error::$action failed ($API_STATUS) $filepath -- $(printf '%s' "$resp" | head -c 400)"
              failed=$((failed + 1))
            fi
          done < <(find templates styles lang assets -type f -print0 2>/dev/null)

          echo "----"
          echo "updated: $updated  created: $created  skipped: $skipped  failed: $failed"
          [ "$failed" -eq 0 ]
